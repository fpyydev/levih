<head>

<style>
  :root {
    --bg: #000000;
    --surface: rgba(255,255,255,0.03);
    --border: rgba(255,255,255,0.08);
    --border-hover: rgba(255,255,255,0.3);
    --text: #f0f0f0;
    --muted: #444;
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  html { scrollbar-width: thin; scrollbar-color: #111 #000; }
  ::-webkit-scrollbar { width: 3px; }
  ::-webkit-scrollbar-thumb { background: #1a1a1a; }

  body {
    background: #000;
    color: var(--text);
    font-family: 'DM Sans', sans-serif;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    overflow-x: hidden;
  }

  #cv {
    position: fixed;
    inset: 0;
    z-index: 0;
    pointer-events: none;
  }

  .vignette {
    position: fixed;
    inset: 0;
    z-index: 1;
    pointer-events: none;
    background: radial-gradient(ellipse 70% 70% at 50% 50%, transparent 30%, rgba(0,0,0,0.85) 100%);
  }

  .page {
    position: relative;
    z-index: 2;
    width: 100%;
    max-width: 460px;
    padding: 70px 24px 90px;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  /* ── AVATAR ── */
  .avatar-wrap {
    position: relative;
    width: 92px;
    height: 92px;
    margin-bottom: 22px;
    opacity: 0;
    animation: avatar-in 1.2s cubic-bezier(0.16,1,0.3,1) 0.2s forwards;
  }

  @keyframes avatar-in {
    from { opacity: 0; transform: scale(0.5) translateY(20px); filter: blur(10px); }
    to   { opacity: 1; transform: scale(1) translateY(0); filter: blur(0); }
  }

  .avatar-img {
    width: 92px;
    height: 92px;
    border-radius: 50%;
    border: 1px solid rgba(255,255,255,0.1);
    background-size: cover;
    background-position: center;
    background-color: #111;
    position: relative;
    z-index: 2;
  }

  .ring {
    position: absolute;
    border-radius: 50%;
    border: 1px solid transparent;
  }
  .ring-1 {
    inset: -6px;
    border-top-color: rgba(255,255,255,0.4);
    border-right-color: rgba(255,255,255,0.1);
    animation: spin 3s linear infinite;
  }
  .ring-2 {
    inset: -13px;
    border-bottom-color: rgba(255,255,255,0.18);
    border-left-color: rgba(255,255,255,0.05);
    animation: spin 6s linear infinite reverse;
  }
  .ring-3 {
    inset: -22px;
    border-top-color: rgba(255,255,255,0.07);
    border-right-color: rgba(255,255,255,0.02);
    animation: spin 10s linear infinite;
  }

  @keyframes spin {
    from { transform: rotate(0deg); }
    to   { transform: rotate(360deg); }
  }

  .avatar-glow {
    position: absolute;
    inset: -30px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(255,255,255,0.07) 0%, transparent 65%);
    animation: glow-pulse 3.5s ease-in-out infinite;
    z-index: 0;
  }

  @keyframes glow-pulse {
    0%,100% { transform: scale(1); opacity: 0.5; }
    50%      { transform: scale(1.18); opacity: 1; }
  }

  /* ── NAME ── */
  .name-wrap {
    overflow: hidden;
    margin-bottom: 6px;
    opacity: 0;
    animation: reveal-up 0.8s cubic-bezier(0.16,1,0.3,1) 0.7s forwards;
  }

  .name {
    font-family: 'DM Mono', monospace;
    font-size: 24px;
    font-weight: 400;
    letter-spacing: 1px;
    color: var(--text);
    display: block;
  }

  .bio-wrap {
    overflow: hidden;
    margin-bottom: 44px;
    opacity: 0;
    animation: reveal-up 0.7s cubic-bezier(0.16,1,0.3,1) 0.9s forwards;
  }

  .bio {
    font-size: 10px;
    color: var(--muted);
    letter-spacing: 4px;
    text-transform: uppercase;
    font-weight: 300;
  }

  @keyframes reveal-up {
    from { opacity: 0; transform: translateY(20px); }
    to   { opacity: 1; transform: none; }
  }

  /* ── LINKS ── */
  .links {
    width: 100%;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .link-btn {
    position: relative;
    display: flex;
    align-items: center;
    gap: 14px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 16px 20px;
    text-decoration: none;
    color: var(--text);
    overflow: hidden;
    opacity: 0;
    transform: translateX(-30px);
    transition: border-color 0.3s, background 0.3s, transform 0.2s;
  }

  .link-btn::before {
    content: '';
    position: absolute;
    top: 0; left: -100%;
    width: 70%;
    height: 100%;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,0.05), transparent);
    transition: left 0.55s ease;
    pointer-events: none;
  }

  .link-btn::after {
    content: '';
    position: absolute;
    inset: 0;
    border-radius: inherit;
    opacity: 0;
    transition: opacity 0.3s;
    box-shadow: inset 0 0 0 1px rgba(255,255,255,0.15),
                0 0 24px rgba(255,255,255,0.04);
    pointer-events: none;
  }

  .link-btn:hover {
    background: rgba(255,255,255,0.055);
    border-color: rgba(255,255,255,0.2);
    transform: translateY(-2px) scale(1.008);
  }

  .link-btn:hover::before { left: 130%; }
  .link-btn:hover::after  { opacity: 1; }
  .link-btn:active { transform: scale(0.99) translateY(0); }

  .link-btn.visible {
    animation: link-in 0.65s cubic-bezier(0.16,1,0.3,1) forwards;
  }

  @keyframes link-in {
    from { opacity: 0; transform: translateX(-30px); filter: blur(4px); }
    to   { opacity: 1; transform: translateX(0); filter: blur(0); }
  }

  .link-icon {
    width: 38px;
    height: 38px;
    border-radius: 10px;
    background: rgba(255,255,255,0.04);
    border: 1px solid rgba(255,255,255,0.07);
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    transition: background 0.3s, transform 0.35s cubic-bezier(0.34,1.56,0.64,1);
  }

  .link-btn:hover .link-icon {
    background: rgba(255,255,255,0.08);
    transform: rotate(-8deg) scale(1.1);
  }

  .link-text { flex: 1; }

  .link-title {
    font-size: 14px;
    font-weight: 500;
    line-height: 1.2;
    transition: letter-spacing 0.3s;
  }

  .link-btn:hover .link-title { letter-spacing: 0.4px; }

  .link-sub {
    font-size: 11px;
    color: var(--muted);
    margin-top: 2px;
    font-weight: 300;
    transition: color 0.3s;
  }

  .link-btn:hover .link-sub { color: #666; }

  .link-arrow {
    font-size: 18px;
    color: var(--muted);
    transition: color 0.3s, transform 0.35s cubic-bezier(0.34,1.56,0.64,1);
    flex-shrink: 0;
  }

  .link-btn:hover .link-arrow {
    color: rgba(255,255,255,0.6);
    transform: translateX(6px);
  }

  /* ── DIVIDER ── */
  .divider {
    width: 0%;
    height: 1px;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,0.08), transparent);
    margin: 2px 0;
    transition: width 1s ease;
  }
  .divider.visible { width: 100%; }

  /* ── SOCIALS ── */
  .socials {
    display: flex;
    gap: 12px;
    margin-top: 36px;
    opacity: 0;
    animation: reveal-up 0.6s ease 1.4s forwards;
  }

  .social-icon {
    width: 42px;
    height: 42px;
    border: 1px solid var(--border);
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--muted);
    text-decoration: none;
    background: var(--surface);
    position: relative;
    overflow: hidden;
    transition: border-color 0.3s, color 0.3s, transform 0.35s cubic-bezier(0.34,1.56,0.64,1), background 0.3s;
  }

  .social-icon::before {
    content: '';
    position: absolute;
    inset: 0;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(255,255,255,0.1), transparent);
    opacity: 0;
    transform: scale(0);
    transition: opacity 0.3s, transform 0.4s cubic-bezier(0.34,1.56,0.64,1);

  .social-icon:hover {
    border-color: rgba(255,255,255,0.25);
    color: rgba(255,255,255,0.8);
    transform: translateY(-5px) scale(1.12);
  }

  .social-icon:hover::before { opacity: 1; transform: scale(1); }

  /* ── FOOTER ── */
  .footer {
    margin-top: 52px;

    color: #1c1c1c;
    letter-spacing: 4px;
    text-transform: uppercase;
    font-family: 'DM Mono', monospace;
    opacity: 0;
    animation: reveal-up 0.6s ease 1.6s forwards;
  }
</style>

<script>
/* ══════════════════════════════════════════
   CANVAS ENGINE
══════════════════════════════════════════ */
const canvas = document.getElementById('cv');
const ctx = canvas.getContext('2d');
let W, H;

function resize() {
  W = canvas.width  = window.innerWidth;
  H = canvas.height = window.innerHeight;
}
resize();
window.addEventListener('resize', () => { resize(); initParticles(); });

/* Mouse */
const mouse = { x: -999, y: -999, px: -999, py: -999 };
window.addEventListener('mousemove', e => {
  mouse.px = mouse.x; mouse.py = mouse.y;
  mouse.x = e.clientX; mouse.y = e.clientY;
});
window.addEventListener('touchmove', e => {
  const t = e.touches[0];
  mouse.px = mouse.x; mouse.py = mouse.y;
  mouse.x = t.clientX; mouse.y = t.clientY;
}, { passive: true });

/* ── PARTICLES ── */
let particles = [];

class Particle {
  constructor() {
    this.x = Math.random() * W;
    this.y = Math.random() * H;
    this.ox = this.x; this.oy = this.y;
    this.vx = (Math.random() - 0.5) * 0.45;
    this.vy = (Math.random() - 0.5) * 0.45;
    this.size = Math.random() * 1.3 + 0.3;
    this.baseAlpha = Math.random() * 0.5 + 0.1;
    this.alpha = this.baseAlpha;
    this.phase = Math.random() * Math.PI * 2;
    this.phaseSpeed = 0.006 + Math.random() * 0.008;
  }

  update() {
    this.phase += this.phaseSpeed;
    const pulse = 0.7 + 0.3 * Math.sin(this.phase);

    /* Mouse repulsion */
    const dx = this.x - mouse.x, dy = this.y - mouse.y;
    const dist = Math.sqrt(dx * dx + dy * dy);
    const repel = 120;
    if (dist < repel && dist > 0) {
      const f = (1 - dist / repel) * 0.9;
      this.vx += (dx / dist) * f;
      this.vy += (dy / dist) * f;
      this.alpha = Math.min(0.95, this.baseAlpha + f * 0.6);
    } else {
      this.alpha += (this.baseAlpha * pulse - this.alpha) * 0.04;
    }

    /* Spring back to origin */
    this.vx += (this.ox - this.x) * 0.0008;
    this.vy += (this.oy - this.y) * 0.0008;

    /* Dampen */
    this.vx *= 0.96;
    this.vy *= 0.96;

    this.x += this.vx;
    this.y += this.vy;

    if (this.x < 0) { this.x = 0; this.vx *= -1; }
    if (this.x > W)  { this.x = W; this.vx *= -1; }
    if (this.y < 0) { this.y = 0; this.vy *= -1; }
    if (this.y > H)  { this.y = H; this.vy *= -1; }

    ctx.beginPath();
    ctx.arc(this.x, this.y, this.size * pulse, 0, Math.PI * 2);
    ctx.fillStyle = `rgba(255,255,255,${this.alpha})`;
    ctx.fill();
  }
}

function initParticles() {
  const count = Math.min(Math.floor((W * H) / 7200), 190);
  particles = Array.from({ length: count }, () => new Particle());
}

/* ── CONNECTIONS ── */
function connect() {
  const maxD = 135;
  for (let a = 0; a < particles.length; a++) {
    for (let b = a + 1; b < particles.length; b++) {
      const dx = particles[a].x - particles[b].x;
      const dy = particles[a].y - particles[b].y;
      const d2 = dx * dx + dy * dy;
      if (d2 < maxD * maxD) {
        const alpha = (1 - Math.sqrt(d2) / maxD) * 0.14;
        ctx.strokeStyle = `rgba(255,255,255,${alpha})`;
        ctx.lineWidth = 0.5;
        ctx.beginPath();
        ctx.moveTo(particles[a].x, particles[a].y);
        ctx.lineTo(particles[b].x, particles[b].y);
        ctx.stroke();
      }
    }
  }
}

/* ── SHOOTING STARS ── */
const shoots = [];

function spawnShoot() {
  if (Math.random() < 0.0035) {
    const angle = Math.random() * 0.5 + 0.15;
    const speed = Math.random() * 7 + 5;
    shoots.push({
      x: Math.random() * W,
      y: Math.random() * H * 0.6,
      vx: Math.cos(angle) * speed,
      vy: Math.sin(angle) * speed,
      len: Math.random() * 110 + 60,
      life: 0,
      maxLife: Math.random() * 55 + 28,
    });
  }
}

function drawShoots() {
  for (let i = shoots.length - 1; i >= 0; i--) {
    const s = shoots[i];
    s.x += s.vx; s.y += s.vy; s.life++;
    const prog = s.life / s.maxLife;
    const alpha = prog < 0.2 ? prog / 0.2 : 1 - ((prog - 0.2) / 0.8);
    if (s.life >= s.maxLife || alpha <= 0) { shoots.splice(i, 1); continue; }

    const spd = Math.hypot(s.vx, s.vy);
    const nx = -s.vx / spd, ny = -s.vy / spd;
    const grd = ctx.createLinearGradient(
      s.x + nx * s.len, s.y + ny * s.len,
      s.x, s.y
    );
    grd.addColorStop(0, 'transparent');
    grd.addColorStop(1, `rgba(255,255,255,${alpha * 0.8})`);
    ctx.strokeStyle = grd;
    ctx.lineWidth = 1.3;
    ctx.beginPath();
    ctx.moveTo(s.x + nx * s.len, s.y + ny * s.len);
    ctx.lineTo(s.x, s.y);
    ctx.stroke();

    /* tiny head dot */
    ctx.beginPath();
    ctx.arc(s.x, s.y, 1.2, 0, Math.PI * 2);
    ctx.fillStyle = `rgba(255,255,255,${alpha * 0.9})`;
    ctx.fill();
  }
}

/* ── MOUSE TRAIL ── */
const trail = [];
const TRAIL_MAX = 28;

function drawTrail() {
  if (mouse.x > 0 && mouse.x < W) {
    trail.push({ x: mouse.x, y: mouse.y });
    if (trail.length > TRAIL_MAX) trail.shift();
  }
  for (let i = 0; i < trail.length; i++) {
    const t = i / trail.length;
    const alpha = t * t * 0.22;
    const r = t * 2.5 + 0.3;
    ctx.beginPath();
    ctx.arc(trail[i].x, trail[i].y, r, 0, Math.PI * 2);
    ctx.fillStyle = `rgba(255,255,255,${alpha})`;
    ctx.fill();
  }
}

/* ── RENDER ── */
function draw() {
  ctx.clearRect(0, 0, W, H);
  drawTrail();
  for (const p of particles) p.update();
  connect();
  spawnShoot();
  drawShoots();
  requestAnimationFrame(draw);
}

initParticles();
draw();

/* ══════════════════════════════════════════
   STAGGERED LINK ENTRANCE
══════════════════════════════════════════ */
const buttons  = document.querySelectorAll('.link-btn');
const dividers = document.querySelectorAll('.divider');

buttons.forEach((btn, i) => {
  setTimeout(() => btn.classList.add('visible'), 1050 + i * 100);
});
setTimeout(() => dividers.forEach(d => d.classList.add('visible')), 1200);

/* ══════════════════════════════════════════
   NAME SCRAMBLE
══════════════════════════════════════════ */
const chars  = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789!@#$%&';
const TARGET = 'llevih';
const nameEl = document.getElementById('name-el');
let frame = 0;

function scramble() {
  frame++;
  const progress = Math.min(frame / 26, 1);
  const revealed = Math.floor(progress * TARGET.length);
  let result = '';
  for (let i = 0; i < TARGET.length; i++) {
    result += i < revealed
      ? TARGET[i]
      : chars[Math.floor(Math.random() * chars.length)];
  }
  nameEl.textContent = result;
  if (progress < 1) requestAnimationFrame(scramble);
  else nameEl.textContent = TARGET;
}

setTimeout(scramble, 720);
</script>
