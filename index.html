<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>llevih | Links</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=Syne:wght@400;700;800&display=swap');

  :root {
    --void: #000000;
    --deep: #030308;
    --surface: #0a0a12;
    --glass: rgba(255,255,255,0.03);
    --glass-border: rgba(255,255,255,0.07);
    --glass-hover: rgba(255,255,255,0.06);
    --text: #f0f0f8;
    --muted: rgba(240,240,248,0.45);
    --accent: #a78bfa;
    --accent2: #60a5fa;
    --accent3: #34d399;
    --glow: rgba(167,139,250,0.15);
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  html { scrollbar-width: thin; scrollbar-color: #1a1a2e #000; }
  ::-webkit-scrollbar { width: 4px; }
  ::-webkit-scrollbar-track { background: #000; }
  ::-webkit-scrollbar-thumb { background: #1a1a2e; border-radius: 2px; }

  body {
    background: var(--void);
    color: var(--text);
    font-family: 'Space Grotesk', sans-serif;
    min-height: 100vh;
    overflow-x: hidden;
    cursor: none;
  }

  /* ── CUSTOM CURSOR ── */
  #cursor-dot {
    position: fixed; width: 8px; height: 8px;
    background: var(--accent); border-radius: 50%;
    pointer-events: none; z-index: 9999;
    transform: translate(-50%, -50%);
    transition: transform 0.05s, background 0.2s;
    mix-blend-mode: screen;
  }
  #cursor-ring {
    position: fixed; width: 36px; height: 36px;
    border: 1px solid rgba(167,139,250,0.5);
    border-radius: 50%; pointer-events: none; z-index: 9998;
    transform: translate(-50%, -50%);
    transition: width 0.25s, height 0.25s, border-color 0.25s, transform 0.12s;
    mix-blend-mode: screen;
  }
  body:has(a:hover) #cursor-ring,
  body:has(button:hover) #cursor-ring {
    width: 52px; height: 52px;
    border-color: rgba(167,139,250,0.9);
  }

  /* ── CANVAS BACKGROUND ── */
  #bg-canvas {
    position: fixed; inset: 0; z-index: 0;
    pointer-events: none;
  }

  /* ── AURORA LAYER ── */
  .aurora {
    position: fixed; inset: 0; z-index: 0;
    pointer-events: none; overflow: hidden;
  }
  .aurora-band {
    position: absolute;
    width: 160%; height: 300px;
    left: -30%; border-radius: 50%;
    filter: blur(80px);
    opacity: 0.12;
    animation: aurora-drift linear infinite;
  }
  .aurora-band:nth-child(1) {
    background: linear-gradient(90deg, #7c3aed, #4f46e5, #0ea5e9);
    top: 5%; animation-duration: 18s; animation-delay: 0s;
    transform-origin: center 50%;
  }
  .aurora-band:nth-child(2) {
    background: linear-gradient(90deg, #059669, #0ea5e9, #7c3aed);
    top: 20%; animation-duration: 22s; animation-delay: -6s;
    opacity: 0.08;
  }
  .aurora-band:nth-child(3) {
    background: linear-gradient(90deg, #4f46e5, #ec4899, #7c3aed);
    top: 50%; animation-duration: 26s; animation-delay: -12s;
    opacity: 0.07;
  }
  @keyframes aurora-drift {
    0%   { transform: translateX(0) scaleY(1) rotate(-2deg); }
    25%  { transform: translateX(-5%) scaleY(1.3) rotate(0deg); }
    50%  { transform: translateX(-10%) scaleY(0.8) rotate(2deg); }
    75%  { transform: translateX(-5%) scaleY(1.1) rotate(0deg); }
    100% { transform: translateX(0) scaleY(1) rotate(-2deg); }
  }

  /* ── FLOATING ORBS ── */
  .orb {
    position: fixed; border-radius: 50%;
    pointer-events: none; z-index: 0;
    filter: blur(100px); opacity: 0;
    animation: orb-float ease-in-out infinite;
  }
  .orb-1 {
    width: 500px; height: 500px;
    background: radial-gradient(circle, rgba(124,58,237,0.3), transparent 70%);
    top: -100px; left: -100px;
    animation-duration: 20s; animation-delay: 0s;
    animation-name: orb-float-1;
  }
  .orb-2 {
    width: 400px; height: 400px;
    background: radial-gradient(circle, rgba(14,165,233,0.25), transparent 70%);
    top: 30%; right: -150px;
    animation-duration: 25s; animation-delay: -8s;
    animation-name: orb-float-2;
  }
  .orb-3 {
    width: 350px; height: 350px;
    background: radial-gradient(circle, rgba(52,211,153,0.2), transparent 70%);
    bottom: 10%; left: 20%;
    animation-duration: 30s; animation-delay: -15s;
    animation-name: orb-float-3;
  }
  @keyframes orb-float-1 {
    0%,100% { opacity: 0.6; transform: translate(0,0) scale(1); }
    33%  { opacity: 0.8; transform: translate(80px, 60px) scale(1.1); }
    66%  { opacity: 0.5; transform: translate(30px, 120px) scale(0.9); }
  }
  @keyframes orb-float-2 {
    0%,100% { opacity: 0.5; transform: translate(0,0) scale(1); }
    33%  { opacity: 0.7; transform: translate(-60px, 80px) scale(1.15); }
    66%  { opacity: 0.4; transform: translate(-20px, -40px) scale(0.85); }
  }
  @keyframes orb-float-3 {
    0%,100% { opacity: 0.4; transform: translate(0,0) scale(1); }
    50%  { opacity: 0.6; transform: translate(100px, -60px) scale(1.2); }
  }

  /* ── MAIN LAYOUT ── */
  .page {
    position: relative; z-index: 1;
    min-height: 100vh;
    display: flex; flex-direction: column;
    align-items: center;
    padding: 0 20px 80px;
  }

  /* ── HEADER / AVATAR ── */
  .header {
    display: flex; flex-direction: column;
    align-items: center;
    padding-top: 80px;
    margin-bottom: 40px;
  }

  .avatar-wrapper {
    position: relative;
    width: 100px; height: 100px;
    margin-bottom: 24px;
  }
  .avatar-ring {
    position: absolute; inset: 0;
    border-radius: 50%;
    animation: ring-spin linear infinite;
  }
  .avatar-ring-1 {
    background: conic-gradient(from 0deg, transparent 60%, #a78bfa, #60a5fa, transparent);
    inset: -4px;
    animation-duration: 3s;
    filter: blur(1px);
  }
  .avatar-ring-2 {
    background: conic-gradient(from 180deg, transparent 50%, #34d399, #a78bfa, transparent);
    inset: -8px;
    opacity: 0.5;
    animation-duration: 5s;
    animation-direction: reverse;
    filter: blur(2px);
  }
  .avatar-ring-3 {
    background: conic-gradient(from 90deg, transparent 70%, #60a5fa, transparent);
    inset: -14px;
    opacity: 0.3;
    animation-duration: 8s;
    filter: blur(3px);
  }
  @keyframes ring-spin {
    from { transform: rotate(0deg); }
    to   { transform: rotate(360deg); }
  }
  .avatar-glow {
    position: absolute;
    inset: -20px; border-radius: 50%;
    background: radial-gradient(circle, rgba(167,139,250,0.25) 0%, transparent 70%);
    animation: pulse-glow 3s ease-in-out infinite;
  }
  @keyframes pulse-glow {
    0%,100% { opacity: 0.6; transform: scale(1); }
    50%  { opacity: 1; transform: scale(1.1); }
  }
  .avatar-img {
    position: relative; z-index: 2;
    width: 100px; height: 100px;
    border-radius: 50%;
    object-fit: cover;
    border: 2px solid rgba(167,139,250,0.3);
    background: #0a0a12;
  }
  .avatar-placeholder {
    position: relative; z-index: 2;
    width: 100px; height: 100px;
    border-radius: 50%;
    background: linear-gradient(135deg, #1e1b4b, #0c0a1a);
    border: 2px solid rgba(167,139,250,0.3);
    display: flex; align-items: center; justify-content: center;
    font-family: 'Syne', sans-serif;
    font-size: 32px; font-weight: 800;
    color: var(--accent); letter-spacing: -1px;
  }

  /* ── GLITCH NAME ── */
  .profile-name {
    font-family: 'Syne', sans-serif;
    font-size: clamp(28px, 6vw, 42px);
    font-weight: 800;
    letter-spacing: -1px;
    color: var(--text);
    position: relative;
    animation: glitch-idle 8s ease-in-out infinite;
  }
  .profile-name::before,
  .profile-name::after {
    content: attr(data-text);
    position: absolute; inset: 0;
    clip-path: polygon(0 0, 100% 0, 100% 40%, 0 40%);
  }
  .profile-name::before {
    color: var(--accent2);
    animation: glitch-before 8s ease-in-out infinite;
    transform: translate(-2px, 0);
  }
  .profile-name::after {
    color: var(--accent);
    clip-path: polygon(0 60%, 100% 60%, 100% 100%, 0 100%);
    animation: glitch-after 8s ease-in-out infinite;
    transform: translate(2px, 0);
  }
  @keyframes glitch-idle {
    0%,94%,100% { transform: translate(0); filter: none; }
    95% { transform: translate(-2px, 1px); filter: hue-rotate(10deg); }
    96% { transform: translate(2px, -1px); filter: hue-rotate(-10deg); }
    97% { transform: translate(-1px, 0); }
    98% { transform: translate(0, 0); filter: none; }
  }
  @keyframes glitch-before {
    0%,93%,100% { opacity: 0; transform: translate(0); }
    94% { opacity: 0.8; transform: translate(-3px, 0); }
    95% { opacity: 0.6; transform: translate(3px, 1px); }
    96% { opacity: 0; }
  }
  @keyframes glitch-after {
    0%,93%,100% { opacity: 0; transform: translate(0); }
    94% { opacity: 0.7; transform: translate(3px, 0); }
    96% { opacity: 0.5; transform: translate(-2px, -1px); }
    97% { opacity: 0; }
  }

  .profile-bio {
    margin-top: 8px;
    font-size: 13px;
    color: var(--muted);
    letter-spacing: 3px;
    text-transform: uppercase;
    font-weight: 300;
  }

  /* ── LINK BUTTONS ── */
  .links {
    width: 100%;
    max-width: 460px;
    display: flex; flex-direction: column;
    gap: 12px;
  }

  .link-btn {
    position: relative;
    display: flex; align-items: center;
    background: var(--glass);
    border: 1px solid var(--glass-border);
    border-radius: 16px;
    padding: 18px 24px;
    text-decoration: none;
    color: var(--text);
    cursor: none;
    overflow: hidden;
    transition: border-color 0.3s, transform 0.3s, background 0.3s;
    backdrop-filter: blur(12px);
  }

  .link-btn::before {
    content: '';
    position: absolute; inset: 0;
    background: linear-gradient(135deg, rgba(167,139,250,0.08), rgba(96,165,250,0.04), transparent);
    opacity: 0;
    transition: opacity 0.3s;
    border-radius: inherit;
  }
  .link-btn::after {
    content: '';
    position: absolute;
    top: 0; left: -100%;
    width: 60%; height: 100%;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,0.04), transparent);
    transition: left 0.6s ease;
  }

  .link-btn:hover {
    border-color: rgba(167,139,250,0.4);
    background: var(--glass-hover);
    transform: translateY(-2px) scale(1.01);
  }
  .link-btn:hover::before { opacity: 1; }
  .link-btn:hover::after { left: 140%; }
  .link-btn:active { transform: translateY(0) scale(0.99); }

  .link-btn-glow {
    position: absolute; inset: 0;
    border-radius: inherit;
    opacity: 0;
    transition: opacity 0.4s;
    pointer-events: none;
  }
  .link-btn:hover .link-btn-glow { opacity: 1; }

  .link-icon {
    width: 44px; height: 44px;
    border-radius: 12px;
    display: flex; align-items: center; justify-content: center;
    margin-right: 16px;
    flex-shrink: 0;
    position: relative; z-index: 1;
    font-size: 20px;
  }

  .link-text { position: relative; z-index: 1; }
  .link-title {
    font-size: 15px;
    font-weight: 600;
    line-height: 1.2;
    letter-spacing: -0.3px;
  }
  .link-sub {
    font-size: 12px;
    color: var(--muted);
    margin-top: 2px;
    font-weight: 300;
  }

  .link-arrow {
    margin-left: auto;
    position: relative; z-index: 1;
    color: var(--muted);
    font-size: 18px;
    transition: transform 0.3s, color 0.3s;
    flex-shrink: 0;
  }
  .link-btn:hover .link-arrow {
    color: var(--accent);
    transform: translateX(4px);
  }

  /* Per-button accent colors */
  .btn-livepix .link-icon { background: rgba(96,165,250,0.12); }
  .btn-livepix .link-btn-glow { box-shadow: inset 0 0 40px rgba(96,165,250,0.06); }
  .btn-livepix:hover { border-color: rgba(96,165,250,0.4); }
  .btn-livepix:hover .link-arrow { color: var(--accent2); }

  .btn-youtube .link-icon { background: rgba(239,68,68,0.12); }
  .btn-youtube .link-btn-glow { box-shadow: inset 0 0 40px rgba(239,68,68,0.06); }
  .btn-youtube:hover { border-color: rgba(239,68,68,0.4); }
  .btn-youtube:hover .link-arrow { color: #f87171; }

  .btn-discord .link-icon { background: rgba(99,102,241,0.12); }
  .btn-discord .link-btn-glow { box-shadow: inset 0 0 40px rgba(99,102,241,0.06); }
  .btn-discord:hover { border-color: rgba(99,102,241,0.5); }
  .btn-discord:hover .link-arrow { color: #818cf8; }

  .btn-instagram .link-icon { background: rgba(236,72,153,0.12); }
  .btn-instagram .link-btn-glow { box-shadow: inset 0 0 40px rgba(236,72,153,0.06); }
  .btn-instagram:hover { border-color: rgba(236,72,153,0.4); }
  .btn-instagram:hover .link-arrow { color: #f472b6; }

  /* ── DIVIDER ── */
  .section-divider {
    width: 100%; max-width: 460px;
    display: flex; align-items: center; gap: 14px;
    margin: 8px 0 4px;
  }
  .divider-line {
    flex: 1; height: 1px;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,0.08), transparent);
  }
  .divider-dot {
    width: 4px; height: 4px; border-radius: 50%;
    background: rgba(167,139,250,0.4);
  }

  /* ── SOCIAL ICONS ── */
  .socials {
    display: flex; gap: 16px;
    margin-top: 36px;
  }
  .social-icon {
    width: 44px; height: 44px;
    border: 1px solid var(--glass-border);
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    color: var(--muted);
    text-decoration: none;
    cursor: none;
    transition: border-color 0.3s, color 0.3s, transform 0.3s, background 0.3s;
    backdrop-filter: blur(8px);
    background: var(--glass);
  }
  .social-icon:hover {
    border-color: rgba(167,139,250,0.5);
    color: var(--accent);
    transform: translateY(-3px) scale(1.1);
    background: rgba(167,139,250,0.08);
  }

  /* ── FOOTER ── */
  .footer {
    margin-top: 60px;
    font-size: 11px;
    color: rgba(255,255,255,0.15);
    letter-spacing: 2px;
    text-transform: uppercase;
    text-align: center;
  }

  /* ── SCAN LINE ── */
  .scanlines {
    position: fixed; inset: 0; z-index: 100;
    pointer-events: none;
    background: repeating-linear-gradient(
      0deg, transparent, transparent 3px,
      rgba(0,0,0,0.03) 3px, rgba(0,0,0,0.03) 4px
    );
    animation: scanline-shift 20s linear infinite;
  }
  @keyframes scanline-shift {
    from { background-position: 0 0; }
    to   { background-position: 0 100px; }
  }

  /* ── NOISE VIGNETTE ── */
  .vignette {
    position: fixed; inset: 0; z-index: 1;
    pointer-events: none;
    background: radial-gradient(ellipse 80% 80% at 50% 50%, transparent 40%, rgba(0,0,0,0.7));
  }

  /* ── ENTRY ANIMATION ── */
  .page { animation: page-in 0.8s cubic-bezier(0.16,1,0.3,1) both; }
  @keyframes page-in {
    from { opacity: 0; transform: translateY(20px); }
    to   { opacity: 1; transform: none; }
  }
  .header { animation: fade-up 0.9s cubic-bezier(0.16,1,0.3,1) 0.1s both; }
  .link-btn:nth-child(1) { animation: fade-up 0.7s cubic-bezier(0.16,1,0.3,1) 0.25s both; }
  .link-btn:nth-child(2) { animation: fade-up 0.7s cubic-bezier(0.16,1,0.3,1) 0.32s both; }
  .link-btn:nth-child(3) { animation: fade-up 0.7s cubic-bezier(0.16,1,0.3,1) 0.39s both; }
  .link-btn:nth-child(4) { animation: fade-up 0.7s cubic-bezier(0.16,1,0.3,1) 0.46s both; }
  .section-divider { animation: fade-up 0.7s cubic-bezier(0.16,1,0.3,1) 0.3s both; }
  .socials { animation: fade-up 0.7s cubic-bezier(0.16,1,0.3,1) 0.55s both; }
  @keyframes fade-up {
    from { opacity: 0; transform: translateY(24px); }
    to   { opacity: 1; transform: none; }
  }

  /* Mobile cursor */
  @media (pointer: coarse) {
    body { cursor: auto; }
    #cursor-dot, #cursor-ring { display: none; }
    .link-btn, .social-icon { cursor: pointer; }
  }
</style>
</head>

<script>
/* ── CURSOR ── */
const dot = document.getElementById('cursor-dot');
const ring = document.getElementById('cursor-ring');
let mx = -100, my = -100, rx = -100, ry = -100;
document.addEventListener('mousemove', e => { mx = e.clientX; my = e.clientY; });
function animCursor() {
  dot.style.left = mx + 'px'; dot.style.top = my + 'px';
  rx += (mx - rx) * 0.12; ry += (my - ry) * 0.12;
  ring.style.left = rx + 'px'; ring.style.top = ry + 'px';
  requestAnimationFrame(animCursor);
}
animCursor();

/* ── CANVAS: STARS + PARTICLES + CONSTELLATIONS ── */
const canvas = document.getElementById('bg-canvas');
const ctx = canvas.getContext('2d');

function resize() {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
}
resize();
window.addEventListener('resize', resize);

/* Stars */
const STAR_COUNT = 280;
const stars = Array.from({length: STAR_COUNT}, () => ({
  x: Math.random() * innerWidth,
  y: Math.random() * innerHeight,
  r: Math.random() * 1.4 + 0.2,
  a: Math.random(),
  speed: Math.random() * 0.3 + 0.05,
  twinkle: Math.random() * Math.PI * 2,
  twinkleSpeed: Math.random() * 0.02 + 0.005,
}));

/* Nebula particles */
const NEBULA_COUNT = 60;
const nebula = Array.from({length: NEBULA_COUNT}, () => ({
  x: Math.random() * innerWidth,
  y: Math.random() * innerHeight,
  r: Math.random() * 180 + 60,
  a: Math.random() * 0.04 + 0.01,
  vx: (Math.random() - 0.5) * 0.15,
  vy: (Math.random() - 0.5) * 0.15,
  hue: Math.random() < 0.4 ? 270 : Math.random() < 0.6 ? 210 : 160,
  hueShift: (Math.random() - 0.5) * 0.3,
}));

/* Shooting stars */
const shoots = [];
function spawnShoot() {
  if (Math.random() < 0.003) {
    shoots.push({
      x: Math.random() * innerWidth,
      y: Math.random() * innerHeight * 0.5,
      vx: Math.random() * 8 + 4,
      vy: Math.random() * 4 + 2,
      life: 1, maxLife: Math.random() * 40 + 20,
    });
  }
}

/* Floating motes */
const MOTE_COUNT = 40;
const motes = Array.from({length: MOTE_COUNT}, () => ({
  x: Math.random() * innerWidth,
  y: Math.random() * innerHeight,
  r: Math.random() * 2 + 0.5,
  vx: (Math.random() - 0.5) * 0.4,
  vy: (Math.random() - 0.5) * 0.4,
  a: Math.random() * 0.5 + 0.1,
  hue: [270, 210, 160, 330][Math.floor(Math.random()*4)],
  pulse: Math.random() * Math.PI * 2,
  pulseSpeed: Math.random() * 0.02 + 0.01,
}));

/* Constellation lines */
function findNear(arr, idx, dist) {
  const res = [];
  for (let i = 0; i < arr.length; i++) {
    if (i === idx) continue;
    const dx = arr[i].x - arr[idx].x, dy = arr[i].y - arr[idx].y;
    if (Math.hypot(dx, dy) < dist) res.push(i);
  }
  return res;
}

let t = 0;
function draw() {
  t++;
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  /* Nebula blobs */
  for (const n of nebula) {
    n.x += n.vx; n.y += n.vy;
    n.hue += n.hueShift;
    if (n.x < -n.r) n.x = canvas.width + n.r;
    if (n.x > canvas.width + n.r) n.x = -n.r;
    if (n.y < -n.r) n.y = canvas.height + n.r;
    if (n.y > canvas.height + n.r) n.y = -n.r;
    const g = ctx.createRadialGradient(n.x, n.y, 0, n.x, n.y, n.r);
    g.addColorStop(0, `hsla(${n.hue},70%,55%,${n.a})`);
    g.addColorStop(1, 'transparent');
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.arc(n.x, n.y, n.r, 0, Math.PI * 2);
    ctx.fill();
  }

  /* Stars */
  for (const s of stars) {
    s.twinkle += s.twinkleSpeed;
    const tw = 0.4 + 0.6 * (0.5 + 0.5 * Math.sin(s.twinkle));
    ctx.save();
    ctx.globalAlpha = s.a * tw;
    ctx.fillStyle = `hsl(${220 + Math.sin(s.twinkle) * 40}, 60%, 90%)`;
    ctx.beginPath();
    ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
    ctx.fill();
    if (s.r > 1.1) {
      ctx.globalAlpha = s.a * tw * 0.3;
      const g = ctx.createRadialGradient(s.x, s.y, 0, s.x, s.y, s.r * 4);
      g.addColorStop(0, 'white'); g.addColorStop(1, 'transparent');
      ctx.fillStyle = g;
      ctx.beginPath();
      ctx.arc(s.x, s.y, s.r * 4, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.restore();
  }

  /* Constellation lines */
  ctx.save();
  ctx.strokeStyle = 'rgba(167,139,250,0.08)';
  ctx.lineWidth = 0.5;
  const bigStars = stars.filter(s => s.r > 1.0);
  for (let i = 0; i < bigStars.length; i++) {
    const near = findNear(bigStars, i, 160);
    for (const j of near) {
      if (j <= i) continue;
      const dx = bigStars[j].x - bigStars[i].x, dy = bigStars[j].y - bigStars[i].y;
      const dist = Math.hypot(dx, dy);
      ctx.globalAlpha = (1 - dist / 160) * 0.15;
      ctx.beginPath();
      ctx.moveTo(bigStars[i].x, bigStars[i].y);
      ctx.lineTo(bigStars[j].x, bigStars[j].y);
      ctx.stroke();
    }
  }
  ctx.restore();

  /* Motes */
  for (const m of motes) {
    m.x += m.vx; m.y += m.vy;
    m.pulse += m.pulseSpeed;
    if (m.x < 0) m.x = canvas.width;
    if (m.x > canvas.width) m.x = 0;
    if (m.y < 0) m.y = canvas.height;
    if (m.y > canvas.height) m.y = 0;
    const pa = m.a * (0.6 + 0.4 * Math.sin(m.pulse));
    ctx.save();
    ctx.globalAlpha = pa;
    const g = ctx.createRadialGradient(m.x, m.y, 0, m.x, m.y, m.r * 3);
    g.addColorStop(0, `hsl(${m.hue}, 80%, 70%)`);
    g.addColorStop(1, 'transparent');
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.arc(m.x, m.y, m.r * 3, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }

  /* Shooting stars */
  spawnShoot();
  for (let i = shoots.length - 1; i >= 0; i--) {
    const s = shoots[i];
    s.x += s.vx; s.y += s.vy; s.life++;
    const prog = s.life / s.maxLife;
    const alpha = prog < 0.3 ? prog / 0.3 : 1 - (prog - 0.3) / 0.7;
    if (alpha <= 0 || s.life >= s.maxLife) { shoots.splice(i, 1); continue; }
    ctx.save();
    ctx.globalAlpha = alpha * 0.8;
    const len = 80 + s.vx * 8;
    const g = ctx.createLinearGradient(s.x - s.vx * len / s.vx, s.y, s.x, s.y);
    g.addColorStop(0, 'transparent');
    g.addColorStop(1, 'rgba(200,180,255,0.9)');
    ctx.strokeStyle = g;
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.moveTo(s.x - s.vx * (len / Math.hypot(s.vx, s.vy)), s.y - s.vy * (len / Math.hypot(s.vx, s.vy)));
    ctx.lineTo(s.x, s.y);
    ctx.stroke();
    ctx.restore();
  }

  /* Mouse interaction – motes attracted */
  for (const m of motes) {
    const dx = mx - m.x, dy = my - m.y;
    const dist = Math.hypot(dx, dy);
    if (dist < 120 && dist > 0) {
      m.vx += dx / dist * 0.04;
      m.vy += dy / dist * 0.04;
      m.vx *= 0.96; m.vy *= 0.96;
    }
  }

  requestAnimationFrame(draw);
}
draw();
</script>
