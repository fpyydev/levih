<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no">
<title>llevih | Links</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@300;400;500&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #080002;
    --red-core: #c0001a;
    --red-mid:  #8a0012;
    --red-deep: #3a0008;
    --red-glow: rgba(200,0,20,0.35);
    --red-faint: rgba(200,0,20,0.08);
    --surface: rgba(200,0,20,0.06);
    --border: rgba(200,0,20,0.18);
    --border-hover: rgba(220,30,50,0.55);
    --text: #f5e8e8;
    --muted: #5a2530;
    --muted2: #7a3040;
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  html { scrollbar-width: thin; scrollbar-color: #1a0005 #080002; }
  ::-webkit-scrollbar { width: 3px; }
  ::-webkit-scrollbar-thumb { background: #2a0008; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'DM Sans', sans-serif;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    overflow-x: hidden;
  }

  /* ══ CANVAS ══ */
  #cv {
    position: fixed;
    inset: 0;
    z-index: 0;
    pointer-events: none;
  }

  /* ══ BACKGROUND AURORA ══ */
  .aurora {
    position: fixed;
    inset: 0;
    z-index: 0;
    pointer-events: none;
    overflow: hidden;
  }
  .aurora-blob {
    position: absolute;
    border-radius: 50%;
    filter: blur(90px);
    mix-blend-mode: screen;
    opacity: 0.18;
  }
  .aurora-blob:nth-child(1) {
    width: 55vw; height: 55vw;
    background: radial-gradient(circle, #c0001a, transparent 70%);
    top: -15%; left: -10%;
    animation: drift1 14s ease-in-out infinite alternate;
  }
  .aurora-blob:nth-child(2) {
    width: 40vw; height: 40vw;
    background: radial-gradient(circle, #ff1a2e, transparent 70%);
    bottom: -10%; right: -5%;
    animation: drift2 18s ease-in-out infinite alternate;
  }
  .aurora-blob:nth-child(3) {
    width: 30vw; height: 30vw;
    background: radial-gradient(circle, #8a0012, transparent 70%);
    top: 40%; left: 55%;
    animation: drift3 22s ease-in-out infinite alternate;
    opacity: 0.12;
  }

  @keyframes drift1 {
    from { transform: translate(0,0) scale(1); }
    to   { transform: translate(6vw, 8vh) scale(1.15); }
  }
  @keyframes drift2 {
    from { transform: translate(0,0) scale(1.1); }
    to   { transform: translate(-5vw,-6vh) scale(0.9); }
  }
  @keyframes drift3 {
    from { transform: translate(0,0) rotate(0deg); }
    to   { transform: translate(-4vw,5vh) rotate(30deg); }
  }

  /* ══ VIGNETTE ══ */
  .vignette {
    position: fixed;
    inset: 0;
    z-index: 1;
    pointer-events: none;
    background: radial-gradient(ellipse 75% 75% at 50% 50%, transparent 20%, rgba(8,0,2,0.92) 100%);
  }

  /* ══ SCAN LINE ══ */
  .scanlines {
    position: fixed;
    inset: 0;
    z-index: 1;
    pointer-events: none;
    background: repeating-linear-gradient(
      0deg,
      transparent,
      transparent 2px,
      rgba(0,0,0,0.03) 2px,
      rgba(0,0,0,0.03) 4px
    );
  }

  /* ══ PAGE ══ */
  .page {
    position: relative;
    z-index: 2;
    width: 100%;
    max-width: 460px;
    padding: 70px 24px 90px;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  /* ══ AVATAR ══ */
  .avatar-wrap {
    position: relative;
    width: 96px;
    height: 96px;
    margin-bottom: 24px;
    opacity: 0;
    animation: avatar-in 1.3s cubic-bezier(0.16,1,0.3,1) 0.2s forwards;
  }

  @keyframes avatar-in {
    from { opacity: 0; transform: scale(0.4) translateY(24px); filter: blur(14px) saturate(0); }
    to   { opacity: 1; transform: scale(1) translateY(0); filter: blur(0) saturate(1); }
  }

  .avatar-img {
    width: 96px;
    height: 96px;
    border-radius: 50%;
    border: 1.5px solid rgba(200,0,20,0.4);
    background-size: cover;
    background-position: center;
    background-color: #1a0005;
    position: relative;
    z-index: 2;
    box-shadow: 0 0 0 0 rgba(200,0,20,0);
    animation: avatar-pulse 3s ease-in-out 1.5s infinite;
  }

  @keyframes avatar-pulse {
    0%,100% { box-shadow: 0 0 0 0 rgba(200,0,20,0), 0 0 20px rgba(200,0,20,0.15); }
    50%      { box-shadow: 0 0 0 6px rgba(200,0,20,0), 0 0 40px rgba(200,0,20,0.35); }
  }

  /* Spinning rings */
  .ring {
    position: absolute;
    border-radius: 50%;
    border: 1px solid transparent;
  }
  .ring-1 {
    inset: -7px;
    border-top-color: rgba(200,0,20,0.7);
    border-right-color: rgba(200,0,20,0.2);
    animation: spin 2.8s linear infinite;
  }
  .ring-2 {
    inset: -15px;
    border-bottom-color: rgba(220,30,50,0.35);
    border-left-color: rgba(200,0,20,0.1);
    animation: spin 5.5s linear infinite reverse;
  }
  .ring-3 {
    inset: -25px;
    border-top-color: rgba(180,0,15,0.15);
    border-right-color: rgba(200,0,20,0.05);
    animation: spin 9s linear infinite;
  }
  .ring-4 {
    inset: -37px;
    border-bottom-color: rgba(160,0,10,0.08);
    animation: spin 15s linear infinite reverse;
  }

  @keyframes spin { to { transform: rotate(360deg); } }

  /* Glow halo */
  .avatar-glow {
    position: absolute;
    inset: -40px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(200,0,20,0.25) 0%, transparent 65%);
    animation: glow-pulse 3.2s ease-in-out infinite;
    z-index: 0;
  }
  @keyframes glow-pulse {
    0%,100% { transform: scale(0.95); opacity: 0.6; }
    50%      { transform: scale(1.2); opacity: 1; }
  }

  /* ══ NAME ══ */
  .name-wrap {
    overflow: hidden;
    margin-bottom: 6px;
    opacity: 0;
    animation: reveal-up 0.8s cubic-bezier(0.16,1,0.3,1) 0.7s forwards;
  }
  .name {
    font-family: 'DM Mono', monospace;
    font-size: 26px;
    font-weight: 400;
    letter-spacing: 3px;
    color: var(--text);
    display: block;
    text-shadow: 0 0 30px rgba(200,0,20,0.5);
  }

  .bio-wrap {
    overflow: hidden;
    margin-bottom: 48px;
    opacity: 0;
    animation: reveal-up 0.7s cubic-bezier(0.16,1,0.3,1) 0.9s forwards;
  }
  .bio {
    font-size: 10px;
    color: var(--muted2);
    letter-spacing: 5px;
    text-transform: uppercase;
    font-weight: 300;
  }

  @keyframes reveal-up {
    from { opacity: 0; transform: translateY(24px); filter: blur(6px); }
    to   { opacity: 1; transform: none; filter: none; }
  }

  /* ══ LINKS ══ */
  .links {
    width: 100%;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .link-btn {
    position: relative;
    display: flex;
    align-items: center;
    gap: 14px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 16px 20px;
    text-decoration: none;
    color: var(--text);
    overflow: hidden;
    opacity: 0;
    transform: translateX(-35px);
    transition: border-color 0.35s, background 0.35s, transform 0.22s, box-shadow 0.35s;
  }

  /* Shine sweep */
  .link-btn::before {
    content: '';
    position: absolute;
    top: 0; left: -120%;
    width: 60%;
    height: 100%;
    background: linear-gradient(90deg, transparent, rgba(200,0,20,0.12), transparent);
    transition: left 0.6s ease;
    pointer-events: none;
  }

  /* Inner glow on hover */
  .link-btn::after {
    content: '';
    position: absolute;
    inset: 0;
    border-radius: inherit;
    opacity: 0;
    transition: opacity 0.35s;
    box-shadow: inset 0 0 0 1px rgba(200,0,20,0.3),
                0 0 30px rgba(200,0,20,0.1);
    pointer-events: none;
  }

  .link-btn:hover {
    background: rgba(200,0,20,0.1);
    border-color: rgba(220,30,50,0.4);
    transform: translateY(-3px) scale(1.01);
    box-shadow: 0 8px 40px rgba(200,0,20,0.15);
  }
  .link-btn:hover::before { left: 140%; }
  .link-btn:hover::after  { opacity: 1; }
  .link-btn:active { transform: scale(0.99); }

  .link-btn.visible {
    animation: link-in 0.7s cubic-bezier(0.16,1,0.3,1) forwards;
  }

  @keyframes link-in {
    from { opacity: 0; transform: translateX(-35px); filter: blur(5px); }
    to   { opacity: 1; transform: translateX(0); filter: none; }
  }

  /* Icon box */
  .link-icon {
    width: 40px;
    height: 40px;
    border-radius: 11px;
    background: rgba(200,0,20,0.07);
    border: 1px solid rgba(200,0,20,0.15);
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    transition: background 0.3s, border-color 0.3s, transform 0.4s cubic-bezier(0.34,1.56,0.64,1);
  }
  .link-btn:hover .link-icon {
    background: rgba(200,0,20,0.15);
    border-color: rgba(220,30,50,0.35);
    transform: rotate(-8deg) scale(1.12);
  }

  .link-text { flex: 1; }
  .link-title {
    font-size: 14px;
    font-weight: 500;
    line-height: 1.2;
    transition: letter-spacing 0.3s;
  }
  .link-btn:hover .link-title { letter-spacing: 0.5px; }
  .link-sub {
    font-size: 11px;
    color: var(--muted);
    margin-top: 2px;
    font-weight: 300;
    transition: color 0.3s;
  }
  .link-btn:hover .link-sub { color: var(--muted2); }

  .link-arrow {
    font-size: 20px;
    color: var(--muted);
    transition: color 0.3s, transform 0.4s cubic-bezier(0.34,1.56,0.64,1);
    flex-shrink: 0;
  }
  .link-btn:hover .link-arrow {
    color: rgba(220,80,90,0.8);
    transform: translateX(7px);
  }

  /* ══ DIVIDER ══ */
  .divider {
    width: 0%;
    height: 1px;
    background: linear-gradient(90deg, transparent, rgba(200,0,20,0.2), transparent);
    margin: 2px 0;
    transition: width 1.2s ease;
  }
  .divider.visible { width: 100%; }

  /* ══ SOCIALS ══ */
  .socials {
    display: flex;
    gap: 14px;
    margin-top: 38px;
    opacity: 0;
    animation: reveal-up 0.6s ease 1.5s forwards;
  }

  .social-icon {
    width: 44px;
    height: 44px;
    border: 1px solid var(--border);
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--muted);
    text-decoration: none;
    background: var(--surface);
    position: relative;
    overflow: hidden;
    transition: border-color 0.3s, color 0.3s, transform 0.4s cubic-bezier(0.34,1.56,0.64,1), background 0.3s, box-shadow 0.3s;
  }
  .social-icon::before {
    content: '';
    position: absolute;
    inset: 0;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(200,0,20,0.25), transparent);
    opacity: 0;
    transform: scale(0);
    transition: opacity 0.3s, transform 0.4s cubic-bezier(0.34,1.56,0.64,1);
  }
  .social-icon:hover {
    border-color: rgba(220,30,50,0.45);
    color: rgba(255,160,160,0.9);
    transform: translateY(-6px) scale(1.14);
    box-shadow: 0 8px 24px rgba(200,0,20,0.25);
  }
  .social-icon:hover::before { opacity: 1; transform: scale(1); }

  /* ══ FOOTER ══ */
  .footer {
    margin-top: 54px;
    font-size: 10px;
    color: #2a0008;
    letter-spacing: 4px;
    text-transform: uppercase;
    font-family: 'DM Mono', monospace;
    opacity: 0;
    animation: reveal-up 0.6s ease 1.7s forwards;
  }

  /* ══ RED FLASH on load ══ */
  .flash {
    position: fixed;
    inset: 0;
    z-index: 100;
    background: var(--red-core);
    pointer-events: none;
    animation: flash-out 0.8s ease 0.05s forwards;
  }
  @keyframes flash-out {
    from { opacity: 0.3; }
    to   { opacity: 0; visibility: hidden; }
  }
</style>

/* ═══════════════════════════════════════
   CANVAS ENGINE — RED PARTICLE FIELD
═══════════════════════════════════════ */
const canvas = document.getElementById('cv');
const ctx = canvas.getContext('2d');
let W, H;

function resize() {
  W = canvas.width  = window.innerWidth;
  H = canvas.height = window.innerHeight;
}
resize();
window.addEventListener('resize', () => { resize(); initParticles(); });

/* Mouse */
const mouse = { x: -999, y: -999 };
window.addEventListener('mousemove', e => { mouse.x = e.clientX; mouse.y = e.clientY; });
window.addEventListener('touchmove', e => {
  const t = e.touches[0];
  mouse.x = t.clientX; mouse.y = t.clientY;
}, { passive: true });

/* ── EMBERS (hot particles) ── */
const embers = [];

class Ember {
  constructor() { this.reset(true); }

  reset(init = false) {
    this.x  = Math.random() * W;
    this.y  = init ? Math.random() * H : H + 10;
    this.vx = (Math.random() - 0.5) * 0.6;
    this.vy = -(Math.random() * 0.8 + 0.2);
    this.size = Math.random() * 1.6 + 0.3;
    this.baseAlpha = Math.random() * 0.55 + 0.1;
    this.alpha = this.baseAlpha;
    this.phase = Math.random() * Math.PI * 2;
    this.phaseSpeed = 0.006 + Math.random() * 0.01;
    this.hue = 0 + Math.random() * 20; // 0–20 red range
    this.sat  = 80 + Math.random() * 20;
    this.lite = 45 + Math.random() * 25;
  }

  update() {
    this.phase += this.phaseSpeed;
    const pulse = 0.75 + 0.25 * Math.sin(this.phase);

    const dx = this.x - mouse.x, dy = this.y - mouse.y;
    const dist = Math.sqrt(dx * dx + dy * dy);
    const repel = 140;
    if (dist < repel && dist > 0) {
      const f = (1 - dist / repel) * 1.1;
      this.vx += (dx / dist) * f * 0.5;
      this.vy += (dy / dist) * f * 0.5;
      this.alpha = Math.min(0.95, this.baseAlpha + f * 0.5);
    } else {
      this.alpha += (this.baseAlpha * pulse - this.alpha) * 0.04;
    }

    this.vx += (Math.random() - 0.5) * 0.03;
    this.vx *= 0.97;
    this.vy *= 0.995;
    this.x += this.vx;
    this.y += this.vy;

    if (this.y < -20 || this.x < -20 || this.x > W + 20) this.reset();

    ctx.beginPath();
    ctx.arc(this.x, this.y, this.size * pulse, 0, Math.PI * 2);
    ctx.fillStyle = `hsla(${this.hue},${this.sat}%,${this.lite}%,${this.alpha})`;
    ctx.fill();

    // glow dot
    if (this.size > 1.2 && this.alpha > 0.3) {
      ctx.beginPath();
      ctx.arc(this.x, this.y, this.size * pulse * 2.5, 0, Math.PI * 2);
      ctx.fillStyle = `hsla(${this.hue},${this.sat}%,${this.lite}%,${this.alpha * 0.08})`;
      ctx.fill();
    }
  }
}

function initParticles() {
  const count = Math.min(Math.floor((W * H) / 6500), 210);
  embers.length = 0;
  for (let i = 0; i < count; i++) embers.push(new Ember());
}

/* ── CONNECTIONS ── */
function connect() {
  const maxD = 130;
  for (let a = 0; a < embers.length; a++) {
    for (let b = a + 1; b < embers.length; b++) {
      const dx = embers[a].x - embers[b].x;
      const dy = embers[a].y - embers[b].y;
      const d2 = dx * dx + dy * dy;
      if (d2 < maxD * maxD) {
        const alpha = (1 - Math.sqrt(d2) / maxD) * 0.12;
        ctx.strokeStyle = `rgba(200,0,20,${alpha})`;
        ctx.lineWidth = 0.5;
        ctx.beginPath();
        ctx.moveTo(embers[a].x, embers[a].y);
        ctx.lineTo(embers[b].x, embers[b].y);
        ctx.stroke();
      }
    }
  }
}

/* ── SHOOTING EMBERS ── */
const shoots = [];

function spawnShoot() {
  if (Math.random() < 0.004) {
    const angle = Math.random() * 0.5 + 0.1;
    const speed = Math.random() * 9 + 6;
    shoots.push({
      x: Math.random() * W * 0.7,
      y: Math.random() * H * 0.55,
      vx: Math.cos(angle) * speed,
      vy: Math.sin(angle) * speed,
      len: Math.random() * 130 + 70,
      life: 0,
      maxLife: Math.random() * 50 + 25,
      hue: Math.random() * 20,
    });
  }
}

function drawShoots() {
  for (let i = shoots.length - 1; i >= 0; i--) {
    const s = shoots[i];
    s.x += s.vx; s.y += s.vy; s.life++;
    const prog  = s.life / s.maxLife;
    const alpha = prog < 0.25 ? prog / 0.25 : 1 - ((prog - 0.25) / 0.75);
    if (s.life >= s.maxLife || alpha <= 0) { shoots.splice(i, 1); continue; }

    const spd = Math.hypot(s.vx, s.vy);
    const nx = -s.vx / spd, ny = -s.vy / spd;
    const grd = ctx.createLinearGradient(
      s.x + nx * s.len, s.y + ny * s.len,
      s.x, s.y
    );
    grd.addColorStop(0, 'transparent');
    grd.addColorStop(1, `hsla(${s.hue},100%,55%,${alpha * 0.9})`);
    ctx.strokeStyle = grd;
    ctx.lineWidth = 1.4;
    ctx.beginPath();
    ctx.moveTo(s.x + nx * s.len, s.y + ny * s.len);
    ctx.lineTo(s.x, s.y);
    ctx.stroke();

    ctx.beginPath();
    ctx.arc(s.x, s.y, 1.5, 0, Math.PI * 2);
    ctx.fillStyle = `hsla(${s.hue},100%,70%,${alpha})`;
    ctx.fill();
  }
}

/* ── MOUSE TRAIL ── */
const trail = [];
const TRAIL_MAX = 32;

function drawTrail() {
  if (mouse.x > 0 && mouse.x < W) {
    trail.push({ x: mouse.x, y: mouse.y });
    if (trail.length > TRAIL_MAX) trail.shift();
  }
  for (let i = 0; i < trail.length; i++) {
    const t = i / trail.length;
    const alpha = t * t * 0.28;
    const r = t * 3 + 0.3;
    ctx.beginPath();
    ctx.arc(trail[i].x, trail[i].y, r, 0, Math.PI * 2);
    ctx.fillStyle = `rgba(200,0,20,${alpha})`;
    ctx.fill();
  }
}

/* ── RENDER LOOP ── */
function draw() {
  ctx.clearRect(0, 0, W, H);
  drawTrail();
  for (const p of embers) p.update();
  connect();
  spawnShoot();
  drawShoots();
  requestAnimationFrame(draw);
}

initParticles();
draw();

/* ═══════════════════════════════════════
   STAGGERED LINK ENTRANCE
═══════════════════════════════════════ */
const buttons  = document.querySelectorAll('.link-btn');
const dividers = document.querySelectorAll('.divider');

buttons.forEach((btn, i) => {
  setTimeout(() => btn.classList.add('visible'), 1100 + i * 110);
});
setTimeout(() => dividers.forEach(d => d.classList.add('visible')), 1250);

/* ═══════════════════════════════════════
   NAME SCRAMBLE
═══════════════════════════════════════ */
const chars  = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789!@#$%&';
const TARGET = 'llevih';
const nameEl = document.getElementById('name-el');
let frame = 0;

function scramble() {
  frame++;
  const progress = Math.min(frame / 28, 1);
  const revealed = Math.floor(progress * TARGET.length);
  let result = '';
  for (let i = 0; i < TARGET.length; i++) {
    result += i < revealed ? TARGET[i] : chars[Math.floor(Math.random() * chars.length)];
  }
  nameEl.textContent = result;
  if (progress < 1) requestAnimationFrame(scramble);
  else nameEl.textContent = TARGET;
}
setTimeout(scramble, 750);
</script>
